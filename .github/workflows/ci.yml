name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: python3 tools/check_gadget_catalogue.py
